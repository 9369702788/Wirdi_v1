name: Build Wirdi Test APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # This repo intentionally ships without /android (see .gitignore) so
      # the scaffold stays platform-folder-free in source control. CI
      # generates a fresh Android project skeleton and drops our lib/ and
      # pubspec.yaml on top of it, then builds.
      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.wirdi --project-name wirdi .

      - name: Verify Android project was generated
        run: |
          echo "Contents of android/app:"
          ls -la android/app || (echo "::error::android/app was not created by 'flutter create'" && exit 1)
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Neither build.gradle nor build.gradle.kts exists under android/app"
            exit 1
          fi
          echo "Found:"
          ls android/app/build.gradle* 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking for the test build)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
